# A small Internet in Docker:
#
#   wan 203.0.113.0/24  the "Internet" (a documentation range: nodes treat it as public addresses,
#                       while 10.x would be seen as private and never be tried for hole punching): public nodes s1, s2, p1, p2 and the outside of three routers
#   lan_a  behind gw_a, port-restricted cone NAT      nodes a1, a2
#   lan_b  behind gw_b, symmetric NAT                 nodes b1, b2
#   lan_c  behind gw_c, port-restricted cone NAT      nodes c1, c2
#
# (The LANs are ordinary bridges: Docker's "internal" networks drop everything that leaves the
# subnet, which includes what a router container forwards. The nodes' default route points at their
# router, and Docker does not route between bridges, so nothing gets around it.)
#
# a <-> c can punch holes through each other; anything with b has to go through a relay. The
# runner (go run ./testbed/runner) starts it, runs the scenarios and breaks things on purpose.
# Every public node is a server (the role of a VPS) with a cover site, as a node on a VPS finds one in its own
# datacenter: here they all mimic the lab's web server (cover.lab). Only x3, the legacy exit of the launchpad's
# failover phase, has none.
# The routers can delay, lose and cut traffic: see NETEM_* and testbed/runner.

x-image: &image
  image: echofog-testbed
  build:
    context: ..
    dockerfile: testbed/Dockerfile

x-node: &node
  <<: *image
  cap_add: [NET_ADMIN]
  restart: "no"
  stop_grace_period: 5s

# a node of the v2 scenarios (T15.1): the image's entrypoint creates the efv2 profile and then either
# serves (EFV2_MODE=serve, EFV2_LISTEN) or waits for the runner's `docker exec efv2 ...` (idle). These
# services are in the "v2" profile: the v1 scenarios' `up -d` leaves them alone, and the runner starts
# the ones a scenario needs by name.
x-efv2: &efv2
  <<: *image
  cap_add: [NET_ADMIN]
  restart: "no"
  stop_grace_period: 5s
  profiles: ["v2"]

x-gateway: &gateway
  <<: *image
  cap_add: [NET_ADMIN]
  sysctls:
    net.ipv4.ip_forward: "1"
  restart: "no"
  stop_grace_period: 1s

networks:
  wan:
    driver: bridge
    # an engine that protects a container from packets routed in from another network (Docker 28+)
    # would drop what the routers forward to the public nodes
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
    ipam:
      config: [{ subnet: 203.0.113.0/24 }]
  lan_a:
    driver: bridge
    ipam:
      config: [{ subnet: 10.20.1.0/24 }]
  lan_b:
    driver: bridge
    ipam:
      config: [{ subnet: 10.20.2.0/24 }]
  lan_c:
    driver: bridge
    ipam:
      config: [{ subnet: 10.20.3.0/24 }]

services:
  # ---- public nodes
  s1:
    <<: *node
    container_name: efbed-s1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: s1, SERVER: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443", BOOTSTRAP: "${BOOTSTRAP:-}", SIGNALING: "${SEED_SIGNALING:-}" }
    networks: { wan: { ipv4_address: 203.0.113.11 } }
  s2:
    <<: *node
    container_name: efbed-s2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: s2, SERVER: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443", BOOTSTRAP: "${BOOTSTRAP:-}", SIGNALING: "${SEED_SIGNALING:-}" }
    networks: { wan: { ipv4_address: 203.0.113.12 } }
  p1:
    <<: *node
    container_name: efbed-p1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: p1, SERVER: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443", BOOTSTRAP: "${BOOTSTRAP:-}" }
    networks: { wan: { ipv4_address: 203.0.113.13 } }
  p2:
    <<: *node
    container_name: efbed-p2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: p2, SERVER: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443", BOOTSTRAP: "${BOOTSTRAP:-}" }
    networks: { wan: { ipv4_address: 203.0.113.14 } }

  # ---- for the VPN scenarios: two exits in the server role, as on a VPS, and a web server that
  # stands in for the Internet (started only by -scenario vpn, load and soak)
  x1:
    <<: *node
    container_name: efbed-x1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: x1, EXIT_UNLIMITED: "${EXIT_UNLIMITED:-}", BOOTSTRAP: "${BOOTSTRAP:-}", SERVER: "1", EXIT: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443" }
    networks: { wan: { ipv4_address: 203.0.113.15 } }
  x2:
    <<: *node
    container_name: efbed-x2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: x2, EXIT_UNLIMITED: "${EXIT_UNLIMITED:-}", BOOTSTRAP: "${BOOTSTRAP:-}", SERVER: "1", EXIT: "1", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443" }
    networks: { wan: { ipv4_address: 203.0.113.16 } }
  # a legacy exit without a cover site: it can only be reached over noise. Only the failover phase of
  # the launchpad starts it, to be the ordinary exit a client on a camouflage exit must never be moved to
  x3:
    <<: *node
    container_name: efbed-x3
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: x3, EXIT_UNLIMITED: "${EXIT_UNLIMITED:-}", BOOTSTRAP: "${BOOTSTRAP:-}", SERVER: "1", EXIT: "1" }
    networks: { wan: { ipv4_address: 203.0.113.18 } }
  # a hidden exit for friends: not in the DHT, it answers only people with its invitation link
  h1:
    <<: *node
    container_name: efbed-h1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: h1, EXIT_UNLIMITED: "${EXIT_UNLIMITED:-}", TLS_SERVER_NAME: cover.lab, CAMOUFLAGE_ADDR: "203.0.113.30:443", BOOTSTRAP: "${BOOTSTRAP:-}", SERVER: "1", EXIT: "1", ACCESS: hidden, PUBLIC_ADDR: "203.0.113.17:4242" }
    networks: { wan: { ipv4_address: 203.0.113.17 } }
  web:
    <<: *image
    container_name: efbed-web
    environment: { ROLE: web }
    restart: "no"
    networks: { wan: { ipv4_address: 203.0.113.30 } }

  # ---- the two efv2 nodes of v2-basic. v2b serves noise3 and writes its peer card; v2a creates
  # its identity and waits, because the echo command needs the store lock itself.
  v2a:
    <<: *image
    container_name: efbed-v2a
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["efv2 init --data /data --profile desktop >/tmp/init.log 2>&1; exec sleep infinity"]
    networks: { wan: { ipv4_address: 203.0.113.41 } }
  v2b:
    <<: *image
    container_name: efbed-v2b
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["efv2 init --data /data --profile desktop >/tmp/init.log 2>&1; exec efv2 run --data /data --listen noise3=203.0.113.42:4433"]
    networks: { wan: { ipv4_address: 203.0.113.42 } }

  # ---- routers
  gw_a:
    <<: *gateway
    container_name: efbed-gw_a
    environment: { ROLE: gateway, NAT: cone, NETEM: "${NETEM_A:-}" }
    networks:
      wan: { ipv4_address: 203.0.113.21 }
      lan_a: { ipv4_address: 10.20.1.2 }
  gw_b:
    <<: *gateway
    container_name: efbed-gw_b
    # NAT_B overrides the kind (symmetric by default; set symmetric-narrow for the birthday scenario)
    environment: { ROLE: gateway, NAT: "${NAT_B:-symmetric}", PORTBLOCK: "${PORTBLOCK_B:-40000-44000}", NETEM: "${NETEM_B:-}" }
    networks:
      wan: { ipv4_address: 203.0.113.22 }
      lan_b: { ipv4_address: 10.20.2.2 }
  gw_c:
    <<: *gateway
    container_name: efbed-gw_c
    environment: { ROLE: gateway, NAT: cone, NETEM: "${NETEM_C:-}" }
    networks:
      wan: { ipv4_address: 203.0.113.23 }
      lan_c: { ipv4_address: 10.20.3.2 }

  # ---- nodes behind the routers
  a1:
    <<: *node
    container_name: efbed-a1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: a1, GATEWAY: 10.20.1.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_USERS:-}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", STUN: "${STUN-}" }
    networks: { lan_a: { ipv4_address: 10.20.1.11 } }
  a2:
    <<: *node
    container_name: efbed-a2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: a2, GATEWAY: 10.20.1.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_USERS:-}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", STUN: "${STUN-}", LISTEN: ":5242" }
    networks: { lan_a: { ipv4_address: 10.20.1.12 } }
  b1:
    <<: *node
    container_name: efbed-b1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: b1, GATEWAY: 10.20.2.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_USERS:-}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", STUN: "${STUN-}" }
    networks: { lan_b: { ipv4_address: 10.20.2.11 } }
  b2:
    <<: *node
    container_name: efbed-b2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: b2, GATEWAY: 10.20.2.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_USERS:-}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", STUN: "${STUN-}", LISTEN: ":5242" }
    networks: { lan_b: { ipv4_address: 10.20.2.12 } }
  c1:
    <<: *node
    container_name: efbed-c1
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: c1, GATEWAY: 10.20.3.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_USERS:-}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", TRANSPORT: "${TRANSPORT_C1:-}", STUN: "${STUN-}" }
    networks: { lan_c: { ipv4_address: 10.20.3.11 } }
  c2:
    <<: *node
    container_name: efbed-c2
    environment: { ECHOFOG_LOG_LEVEL: "${LOG_LEVEL:-info}", NAME: c2, GATEWAY: 10.20.3.2, BOOTSTRAP: "${BOOTSTRAP:-}", GUARD_MODE: "${GUARD_MODE_C2:-${GUARD_MODE_USERS:-}}", TCP_ROTATE: "${TCP_ROTATE_USERS:-}", STUN: "${STUN-}", LISTEN: ":5242" }
    networks: { lan_c: { ipv4_address: 10.20.3.12 } }

  # ---- the nodes of the v2 scenarios (T15.1), profile "v2". The live mode of each scenario is
  # described in testbed/scenarios/live.go; what it still needs from the efv2 CLI is listed there.
  # v2-nat, v2-call: a public relay
  v2r:
    <<: *efv2
    container_name: efbed-v2r
    environment: { ROLE: efv2, EFV2_MODE: serve, EFV2_PROFILE: server, EFV2_LISTEN: "noise3=203.0.113.44:4433" }
    networks: { wan: { ipv4_address: 203.0.113.44 } }
  # v2-nat: behind gw_a (port-restricted cone)
  v2na:
    <<: *efv2
    container_name: efbed-v2na
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.1.2 }
    networks: { lan_a: { ipv4_address: 10.20.1.21 } }
  # v2-nat: behind gw_b (symmetric, or symmetric-narrow with NAT_B)
  v2nb:
    <<: *efv2
    container_name: efbed-v2nb
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.2.2 }
    networks: { lan_b: { ipv4_address: 10.20.2.21 } }
  # v2-nat: behind gw_c (port-restricted cone)
  v2nc:
    <<: *efv2
    container_name: efbed-v2nc
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.3.2 }
    networks: { lan_c: { ipv4_address: 10.20.3.21 } }
  # v2-paths: the client, behind gw_b, whose router is cut
  v2pa:
    <<: *efv2
    container_name: efbed-v2pa
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.2.2 }
    networks: { lan_b: { ipv4_address: 10.20.2.22 } }
  # v2-paths: a server with two noise3 addresses, two paths
  v2pb:
    <<: *efv2
    container_name: efbed-v2pb
    environment: { ROLE: efv2, EFV2_MODE: serve, EFV2_PROFILE: server, EFV2_LISTEN: "noise3=203.0.113.46:4433,noise3=203.0.113.46:4434" }
    networks: { wan: { ipv4_address: 203.0.113.46 } }
  # v2-hidden: the hidden node (no public card; invitations only)
  v2h:
    <<: *efv2
    container_name: efbed-v2h
    environment: { ROLE: efv2, EFV2_MODE: serve, EFV2_PROFILE: desktop, EFV2_LISTEN: "noise3=203.0.113.47:4433" }
    networks: { wan: { ipv4_address: 203.0.113.47 } }
  # v2-hidden: the guest, with the invitation link
  v2ha:
    <<: *efv2
    container_name: efbed-v2ha
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop }
    networks: { wan: { ipv4_address: 203.0.113.48 } }
  # v2-hidden: the stranger, with the address and without the secret
  v2hb:
    <<: *efv2
    container_name: efbed-v2hb
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop }
    networks: { wan: { ipv4_address: 203.0.113.49 } }
  # v2-messaging: a sender behind gw_a
  v2ma:
    <<: *efv2
    container_name: efbed-v2ma
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.1.2 }
    networks: { lan_a: { ipv4_address: 10.20.1.22 } }
  # v2-messaging: a receiver behind gw_c
  v2mb:
    <<: *efv2
    container_name: efbed-v2mb
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.3.2 }
    networks: { lan_c: { ipv4_address: 10.20.3.22 } }
  # v2-messaging: a server for the DHT and the mailbox
  v2mx:
    <<: *efv2
    container_name: efbed-v2mx
    environment: { ROLE: efv2, EFV2_MODE: serve, EFV2_PROFILE: server, EFV2_LISTEN: "noise3=203.0.113.50:4433" }
    networks: { wan: { ipv4_address: 203.0.113.50 } }
  # v2-call: the caller behind gw_a
  v2ca:
    <<: *efv2
    container_name: efbed-v2ca
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.1.2 }
    networks: { lan_a: { ipv4_address: 10.20.1.23 } }
  # v2-call: the callee behind gw_c
  v2cc:
    <<: *efv2
    container_name: efbed-v2cc
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop, GATEWAY: 10.20.3.2 }
    networks: { lan_c: { ipv4_address: 10.20.3.23 } }
  # v2-exit: the exit (the lab web server `web` stands behind it)
  v2xe:
    <<: *efv2
    container_name: efbed-v2xe
    environment: { ROLE: efv2, EFV2_MODE: serve, EFV2_PROFILE: server, EFV2_LISTEN: "noise3=203.0.113.53:4433" }
    networks: { wan: { ipv4_address: 203.0.113.53 } }
  # v2-exit: the exit client
  v2xc:
    <<: *efv2
    container_name: efbed-v2xc
    environment: { ROLE: efv2, EFV2_MODE: idle, EFV2_PROFILE: desktop }
    networks: { wan: { ipv4_address: 203.0.113.54 } }
