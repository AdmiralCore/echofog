# An EchoFog node: DHT member, relay for peers behind NATs, optionally a paid exit. It runs as a
# server (ECHOFOG_ROLE=server): no chat, calls or file transfer of its own. With
# ECHOFOG_ACCESS=hidden or isolated in .env it serves only the people with its invitation link.
#
# It runs the ready-made image that GitHub builds from main (ghcr.io/admiralcore/echofog-node),
# so the server compiles nothing. To build from this checkout instead, add
# -f deploy/docker-compose.build.yml to every command and --build to up.
#
#   cp deploy/.env.example deploy/.env      # and edit it
#   docker compose -f deploy/docker-compose.yml pull           # also how you update
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f        # stats line every minute
#   docker compose -f deploy/docker-compose.yml exec node echofog-node status
#   docker compose -f deploy/docker-compose.yml exec node echofog-node invite   # the invitation link
services:
  node:
    # ECHOFOG_IMAGE in .env pins another tag, e.g. ghcr.io/admiralcore/echofog-node:sha-4d6bfaa
    image: ${ECHOFOG_IMAGE:-ghcr.io/admiralcore/echofog-node:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # a VPS node is a server unless .env says otherwise (an .env from before the role existed
      # has no ECHOFOG_ROLE)
      ECHOFOG_ROLE: ${ECHOFOG_ROLE:-server}
      # optional: the identity password as a Docker secret instead of ECHOFOG_PASSWORD (with
      # "secrets: [echofog_password]" below)
      # ECHOFOG_PASSWORD_FILE: /run/secrets/echofog_password
      # optional: the access secret of a hidden or isolated node as a Docker secret (with
      # "secrets: [echofog_access_secret]" below)
      # ECHOFOG_ACCESS_SECRET_FILE: /run/secrets/echofog_access_secret
    # the identity, the database and the TON wallet cache live here: back it up
    volumes:
      - echofog-data:/data
    ports:
      # publish 443 so the node blends with normal HTTPS/HTTP3; set ADVERTISE_PORT=443 in .env
      - "443:4242/udp"    # QUIC (HTTP/3 port): messages, calls, relayed and proxied traffic
      - "443:4242/tcp"    # TCP fallback (HTTPS port) for networks that block UDP
    # the node exits cleanly on SIGTERM (database closed); give it time to do so
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    # optional: Docker secrets for the variables commented out under environment above
    # secrets: [echofog_password, echofog_access_secret]

volumes:
  echofog-data:

