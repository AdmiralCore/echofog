syntax = "proto3";

package storage;
option go_package = "github.com/echofog/echofog-core/internal/storage;storage";

message PeerStoreEntry {
  bytes pub_key = 1;
  string last_known_addr = 2;
  uint64 last_seen = 3;
  uint32 trust_score = 4;
  uint32 fail_count = 5;  // dial failures since the last successful connection
  uint64 last_failed = 6; // unix nanoseconds of the last failed dial
}