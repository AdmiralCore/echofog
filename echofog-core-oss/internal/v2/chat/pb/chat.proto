// chat/2 messages (docs/protocol/v2/services.md 4).
//
// SecureMessage, RatchetHeader and X3DHInit are copies of v1's internal/proto/message.proto with the
// SAME field numbers and types: services 4.2 puts the v1 messages inside Inner, and the key
// agreement and the ratchet keep v1's constructions, so the encoding must stay byte-equal
// (checked against bytes made by v1 in testdata/v1_samples.json).
//
// X3DHInit.sender_bundle (5) is declared only to keep the number: v2 binds the sender's identity key
// through the sender's prekeys/2 (objects.md 5), never through a bundle sent in the init, and a
// sender must leave it empty. A receiver ignores it.
//
// BundleGet and Bundle are the bodies of BUNDLE_GET and BUNDLE (services 4.1).
//
// Field numbers are never reused (versioning.md 3.5).
syntax = "proto3";

package echofog.v2.chat;

option go_package = "github.com/echofog/echofog-core/internal/v2/chat/pb;chatpb";

message RatchetHeader {
  bytes ratchet_key = 1;
  uint32 pn = 2;
  uint32 n = 3;
}

message SecureMessage {
  RatchetHeader header = 1;
  bytes ciphertext = 2;
}

message X3DHInit {
  bytes ephemeral_key = 1;
  bytes identity_key = 2;
  bytes one_time_key_id = 3;
  SecureMessage initial_ciphertext = 4;
  bytes sender_bundle = 5; // unused in v2
  bytes kem_ciphertext = 6;
  bytes kem_key_id = 7;
  int64 bundle_created_at = 8; // unused in v2 (every v2 init is PQXDH)
}

// BUNDLE_GET body (0x42).
message BundleGet {
  uint64 req = 1;
}

// BUNDLE body (0x43): a prekeys/2 envelope with one fresh one-time prekey.
message Bundle {
  uint64 req = 1;
  bytes prekeys = 2;
}

// ---- delivery (T7.2) ----------------------------------------------------------------------

// SealedEnvelope is the DELIVER payload (services.md 4.2): the recipient's node ID, an ephemeral
// X25519 key and the box that holds an Inner. Nothing else is in the serialised envelope.
message SealedEnvelope {
  bytes to = 1;
  bytes eph = 2;
  bytes box = 3;
}

// Inner is what the box holds.
message Inner {
  bytes sender = 1;  // akey of the sender's account key
  bytes id = 2;      // 16-byte message ID
  uint64 time = 3;
  oneof body {
    bytes pqxdh_init = 4; // an X3DHInit message
    bytes ratchet = 5;    // a SecureMessage
  }
  bytes device = 6;  // akey of the sending device key
}

// PersonalMessageType, PersonalMessageProto: copies of v1's messenger/personal_messages.proto with
// the same numbers (checked against bytes made by v1), plus control (11) and pad (15)
// (services.md 4.3). The serialised plaintext is padded to a bucket with pad.
enum PersonalMessageType {
  MSG_TYPE_TEXT = 0;
  MSG_TYPE_PHOTO = 1;
  MSG_TYPE_VOICE = 2;
  MSG_TYPE_CIRCLE = 3;
  MSG_TYPE_FILE = 4;
  MSG_TYPE_LOCATION = 5;
}

message PersonalMessageProto {
  string id = 1;
  string sender_id = 2;
  PersonalMessageType type = 3;
  string text = 4;
  string content_hash = 5;
  string metadata = 6;
  int64 timestamp = 7;
  string reply_to_id = 8;
  bytes conv_event = 9;
  bytes conv_sync = 10;
  Control control = 11;
  bytes pad = 15;
}

// Control replaces v1's text prefixes fogknock1:, fogreset1: and fogack1: (K3).
message Control {
  oneof kind {
    Knock knock = 1;
    Reset reset = 2;
    Receipt read = 3;
    Receipt delivered = 4;
  }
}

// Knock asks (ask = true) or answers with a card; card is a card/2 envelope.
message Knock {
  bool ask = 1;
  bytes card = 2;
}

// Reset says the sender's session with the receiver is broken and a new one is coming.
message Reset {}

// Receipt names the messages it confirms.
message Receipt {
  repeated bytes ids = 1;
}
