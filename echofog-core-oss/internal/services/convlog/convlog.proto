syntax = "proto3";

package convlog;
option go_package = "github.com/echofog/echofog-core/internal/services/convlog;convlog";

// Event is one entry of a conversation log: a message or an operation on one. It is signed by its
// author over the canonical encoding in event.go (fields 1..11, the body by its hash), so whoever
// relays or serves it cannot change it. Future envelope-level additions go in ext; kind-specific
// ones in body.
message Event {
  bytes  conv     = 1;  // 16-byte conversation id
  bytes  author   = 2;  // the author's 32-byte Ed25519 identity public key
  uint64 seq      = 3;  // per (conv, author): 1, 2, 3, ... never reused
  uint64 lamport  = 4;  // max(lamport of everything the author had seen in conv) + 1
  int64  ts_ms    = 5;  // the author's clock, for display only
  uint32 kind     = 6;
  bytes  target   = 7;  // the event this one acts on (edit, delete, react, pin)
  bytes  reply_to = 8;  // the message this one answers
  bytes  thread   = 9;  // the root message of the thread this one belongs to
  bytes  body      = 10;
  bytes  ext       = 11;
  bytes  body_hash = 12; // set instead of body once the body was stripped (a deleted message);
                         // the signature covers SHA-256(body), so a stripped event still verifies
  bytes  sig       = 15;
}

message MsgBody {
  string text     = 1;
  uint32 type     = 2;  // as messenger.PersonalMessageTypeProto; 100 = system line
  string metadata = 3;  // JSON, as messenger.MessageMetadata (files)
}

message EditBody {
  string text = 1;
}

message ReactBody {
  string emoji = 1;
  bool   on    = 2;
}

message PinBody {
  bool on = 1;
}

// MemberBody changes who is in a group and with which role. The group's founder opens its
// membership with a roster; after that every join, role change, removal and ban is an event, and
// what anyone may do at a point of the log follows from the ones before that point.
message MemberBody {
  uint32 action = 1;            // 1 roster, 2 join, 3 role, 4 remove, 5 ban, 6 unban, 7 define a role, 8 invite, 9 timeout
  bytes  member = 2;            // the member's 32-byte identity public key (not for a roster)
  string role   = 3;            // role: the new role; join: the role given (empty: the default)
  repeated RosterEntry roster = 4;
  // remove, ban, timeout: the member's last sequence number the author had seen. Everyone refuses their
  // events numbered after it unless they are let in again later: an author picks the Lamport of
  // their events, so without this a removed member could write "before" the removal. 0: not said.
  uint64 upto_seq = 5;
  RoleDef def = 6;              // define: the role as it is to be
  InviteDef invite = 7;         // invite: an invitation made or revoked
  // join: the invitation (InviteDef.n) the member came in with; it counts as one of its uses
  string via = 8;
  // timeout: until when the member may not write or react, unix seconds (now or earlier lifts it);
  // upto_seq says their last event before it, as for a removal
  int64 until = 9;
}

// InviteDef is an invitation to a group: who may invite makes one (with how long it lets people
// in, how many, and the role they get), the one who made it or who manages roles revokes it. The
// link carries a token signed by its maker with the same n; who lets a newcomer in checks both.
message InviteDef {
  string n       = 1; // the token's nonce, hex
  int64  exp     = 2; // until when it lets people in, unix seconds
  uint32 uses    = 3; // how many people it lets in; 0: no limit
  string role    = 4; // the role they get; empty: the group's default one
  string label   = 5; // a note for the members who manage invitations
  bool   revoked = 6;
  bool   approval = 7; // who comes with it waits until someone who lets members in accepts them
}

// RoleDef is a role of a group as its definition says: a custom one, or a built-in one whose
// permissions, title or colour were changed (a built-in one keeps its rank). Those who may manage
// roles write it, for roles below their own rank, granting no permission they do not hold.
message RoleDef {
  string id      = 1;  // [a-z0-9-], at most 32; a built-in role's name changes that role
  string title   = 2;  // what the app shows; empty: the id
  uint32 color   = 3;  // 0xRRGGBB; 0: none
  int32  rank    = 4;  // 1..99 for a custom role; members act only on lower ranks
  uint32 perms   = 5;  // permission bits
  bool   removed = 6;  // a custom role goes; its members get the group's default role
}

// EventExt rides in Event.ext (signed, kept when the body is stripped).
message EventExt {
  string channel = 1;  // a group's channel the message is in; empty: the main one
}

// ChannelBody creates, changes or removes a channel of a group: the whole channel as it is to be
// (last writer wins per id). The entry with the empty id is the main channel's: its name, topic,
// read-only, slow mode and the channel the group opens on.
message ChannelBody {
  string id        = 1;
  string name      = 2;
  bool   voice     = 3;  // a voice room rather than a text channel
  bool   removed   = 4;
  string topic     = 5;  // a line under the name
  bool   read_only = 6;  // only those who may manage the group write in it (announcements)
  int32  position  = 7;  // the channels' order among their kind, lowest first
  string parent    = 8;  // the category the channel is in; empty: none
  bool   category  = 9;  // a category: a heading the channels with it as parent sit under
  uint32 slow_secs = 10; // slow mode: seconds a member waits between their messages in it
  string open      = 11; // the main channel's entry (id ""): the channel the group opens on
  // what roles may do in this channel otherwise than in the group: "*" (everyone) first, then the
  // member's own role; only the channel's permissions (writing, files, links, comments, reactions,
  // pins, voice, streams, deleting others' messages) can be changed here
  repeated RoleOverride overrides = 12;
}

message RoleOverride {
  string role  = 1; // a role's id, or "*" for everyone
  uint32 allow = 2; // permission bits granted here
  uint32 deny  = 3; // permission bits taken here
}

// ThreadBody names the thread under a message (kind THREAD; last writer wins per root).
message ThreadBody {
  string title = 1;
}

message RosterEntry {
  bytes  member = 1;  // 32-byte identity public key
  string role   = 2;
}

// Sync is the anti-entropy exchange between two participants of a conversation.
message Sync {
  oneof m {
    Hello      hello  = 1;
    Want       want   = 2;
    Events     events = 3;
    IHave      ihave  = 4;
  }
}

// IHave announces, in a big group, the newest events a member holds of some authors: those an
// event was not pushed to learn of it, and ask (Want) if they lack it. Lazy push, as in Plumtree:
// the push goes to a few, the announcement to more, and a lost push is mended in seconds instead
// of at the next anti-entropy round.
message IHave {
  bytes         conv = 1;
  repeated Have have = 2; // author and the highest seq held of them
}

message Hello {
  repeated HelloItem items = 1;
}

message HelloItem {
  bytes conv   = 1;
  bytes digest = 2;  // 8 bytes of SHA-256 over the sorted version vector
}

message Want {
  bytes           conv = 1;
  repeated Have   have = 2;
}

message Have {
  bytes  author = 1;
  uint64 seq    = 2;  // the highest seq held with no gap below it
}

message Events {
  bytes          conv   = 1;
  repeated bytes events = 2;  // encoded Event messages
  bool           more   = 3;
}
