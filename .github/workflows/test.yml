name: test

# Runs the Go tests and builds the frontend on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The core suite is split into parts that run side by side, and every part runs one test binary
  # at a time (-p 1): many packages start real QUIC nodes on loopback with time limits, and two of
  # them beside each other on a 4-vCPU runner starve the meshes into timeouts that look like
  # failures (a different test each run, all green on their own). Round-robin over the package
  # list keeps the parts balanced and still covers the list whole.
  go:
    name: Go tests (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # the desktop module imports the Wails runtime, which needs these to compile on Linux
      - name: WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet
        if: matrix.part == 0
        run: go vet ./echofog-core-oss/...
      - name: Test core
        run: |
          set -euo pipefail
          go list ./echofog-core-oss/... | awk -v p=${{ matrix.part }} 'NR % 4 == p' > part.txt
          echo "$(wc -l < part.txt) packages in this part"
          test -s part.txt
          xargs go test -p 1 -count=1 < part.txt

  # main.go embeds frontend/dist, which is not in git (the frontend job builds the real one);
  # the Go tests only need the folder to exist so the package compiles
  desktop:
    name: Desktop tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Placeholder frontend build
        run: |
          mkdir -p echofog-desktop-oss/frontend/dist
          echo '<!doctype html><title>EchoFog</title>' > echofog-desktop-oss/frontend/dist/index.html
      - name: Test desktop (headless)
        run: xvfb-run -a go test -tags webkit2_41 ./echofog-desktop-oss/... -count=1

  # The core is full of goroutines (QUIC streams, call trees, payments); a data race there shows
  # up as a rare crash on someone's machine, so every push runs the core under the race detector.
  # Its own job, split into parts like the plain tests: it is several times slower.
  race:
    name: Go race detector (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test core with -race
        run: |
          set -euo pipefail
          go list ./echofog-core-oss/... | grep -v -e /internal/simulation -e /testbed \
            | awk -v p=${{ matrix.part }} 'NR % 4 == p' > part.txt
          echo "$(wc -l < part.txt) packages in this part"
          test -s part.txt
          xargs go test -race -p 1 -count=1 -timeout 25m < part.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echofog-desktop-oss/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  contract:
    name: Vault contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echofog-core-oss/contracts/vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # rebuild from source: the code the Go app embeds must be exactly this build
      - run: npm run build
      - name: Embedded code matches the source
        run: git diff --exit-code -- ../../internal/wallet/tonwallet/vault_code.boc
      - run: npm test
