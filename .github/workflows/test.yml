name: test

# Runs the Go tests and builds the frontend on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      # the desktop module imports the Wails runtime, which needs these to compile on Linux
      - name: WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet
        run: go vet ./echofog-core-oss/...
      - name: Test core
        run: go test ./echofog-core-oss/... -count=1
      # main.go embeds frontend/dist, which is not in git (the frontend job builds the real one);
      # the Go tests only need the folder to exist so the package compiles
      - name: Placeholder frontend build
        run: |
          mkdir -p echofog-desktop-oss/frontend/dist
          echo '<!doctype html><title>EchoFog</title>' > echofog-desktop-oss/frontend/dist/index.html
      - name: Test desktop (headless)
        run: xvfb-run -a go test -tags webkit2_41 ./echofog-desktop-oss/... -count=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echofog-desktop-oss/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build

  contract:
    name: Vault contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echofog-core-oss/contracts/vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # rebuild from source: the code the Go app embeds must be exactly this build
      - run: npm run build
      - name: Embedded code matches the source
        run: git diff --exit-code -- ../../internal/wallet/tonwallet/vault_code.boc
      - run: npm test
