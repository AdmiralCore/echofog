name: v2

# Checks for the v2 protocol tree: vet, formatting, tests under the race detector, the AD1 import
# boundary, reproducible test vectors, cross-platform builds and a short fuzz smoke. Runs on the
# v2 integration branch and on v2-<task> branches. The v1 jobs stay in test.yml and gate dev/main.
on:
  push:
    branches:
      - v2
      - 'v2-*'
  pull_request:
    branches:
      - v2
      - 'v2-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Tests and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: echofog-core-oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Vet
        run: go vet ./internal/v2/...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l internal/v2)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Tests with the race detector
        run: go test -race -count=1 ./internal/v2/...

      # The same check the race run already performs, repeated explicitly so a boundary failure
      # is named in the job log instead of hiding behind a package failure.
      - name: Import boundary (AD1)
        run: go test ./internal/v2 -run '^TestImportBoundary$' -v -count=1

      # The v1 packages v2 reuses through ports must themselves stay clear of the v1 network
      # (T7.0, T10.0). call and call/media join this list after T9.0.
      - name: Import boundary of v1 port packages
        env:
          ECHOFOG_IMPORT_PATTERNS: ./internal/services/contacts ./internal/network/exit_gateway/core
        run: go test ./internal/v2 -run '^TestImportBoundary$' -v -count=1

      # link.json is excluded: its DEFLATE bytes depend on the compressor, decoding is what is
      # normative (docs/protocol/v2/vectors/README.md).
      - name: Test vectors match the spec
        working-directory: .
        run: |
          set -euo pipefail
          ( cd docs/protocol/v2/vectors/gen && go run . -out .. )
          git diff --exit-code -- docs/protocol/v2/vectors ':!docs/protocol/v2/vectors/link.json'

  build:
    name: Cross build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: echofog-core-oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      # platforms.md §1.1: android/amd64 covers emulators; linux/arm guards against 32-bit
      # assumptions in the protocol code. ios links through gomobile with the external linker,
      # but the packages themselves are pure Go and build with CGO_ENABLED=0.
      - name: Build for android, ios and linux/arm
        run: |
          set -eux
          for target in android/arm64 android/amd64 ios/arm64 linux/arm; do
            os=${target%/*}
            arch=${target#*/}
            echo "::group::$target"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./internal/v2/...
            echo "::endgroup::"
          done

      # platforms.md §1.1 requires `gomobile bind -target=android` to succeed. The binding
      # package arrives in T12.1, so the step waits for the directory to exist.
      - name: gomobile bind (android)
        if: hashFiles('echofog-core-oss/mobile/**') != ''
        run: |
          set -eux
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" bind -target=android -androidapi 26 -o mobile.aar ./mobile

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: echofog-core-oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      # Ten seconds per target: long enough to catch a crash in the parsers, short enough for
      # the whole tree (about thirty targets) to stay well inside the job timeout.
      - name: Every fuzz target for 10 seconds
        run: |
          set -euo pipefail
          for pkg in $(go list ./internal/v2/...); do
            targets=$(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true)
            for target in $targets; do
              echo "::group::$pkg $target"
              go test "$pkg" -run '^$' -fuzz "^${target}$" -fuzztime 10s
              echo "::endgroup::"
            done
          done
