name: build

# Builds the release binaries: the headless node for Linux and Windows, and the desktop app for
# both. Runs on pushes to main, on version tags, and on demand. Artifacts are attached to the run;
# a version tag (v1.2.3) also publishes a draft GitHub release with a SHA256SUMS file.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: echofog-node (linux & windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-${GITHUB_SHA::7}"
          mkdir -p out
          for target in linux/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "out/echofog-node-$VERSION-$os-$arch$ext" ./echofog-core-oss/cmd/echofog-node
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: echofog-node
          path: out/*

  desktop:
    name: EchoFog desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # The released wails v2.11.0 binary is built with an old golang.org/x/tools that cannot load
      # Go 1.27 type information ("package context without types"). Rebuild the same version against
      # a newer x/tools so it works under Go 1.27.
      - name: Install Wails CLI
        shell: bash
        run: |
          set -eux
          tmp="$(mktemp -d)"
          cd "$tmp"
          go mod init wailsbuild
          go get github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          go get golang.org/x/tools@v0.52.0
          out="$(go env GOPATH)/bin/wails"
          [ "$RUNNER_OS" = "Windows" ] && out="$out.exe"
          go build -o "$out" github.com/wailsapp/wails/v2/cmd/wails
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Wails builds the frontend itself (npm install + npm run build, from wails.json). It has to:
      # frontend/dist is not in git and main.go embeds it, so never pass -s (skip frontend) here.
      - name: Wails build
        shell: bash
        working-directory: echofog-desktop-oss
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-${GITHUB_SHA::7}"
          # the version shown in the Windows file properties
          node -e 'const fs=require("fs"),j=JSON.parse(fs.readFileSync("wails.json"));j.info.productVersion=process.argv[1];fs.writeFileSync("wails.json",JSON.stringify(j,null,2))' "$VERSION"
          tags=""
          [ "$RUNNER_OS" = "Linux" ] && tags="-tags webkit2_41"
          wails build -clean -trimpath -ldflags "-s -w -X main.version=$VERSION" $tags
          test -s frontend/dist/index.html
          os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          cd build/bin
          for f in EchoFog*; do mv "$f" "${f/EchoFog/EchoFog-$VERSION-$os-amd64}"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: echofog-desktop-${{ runner.os }}
          path: echofog-desktop-oss/build/bin/*

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [node, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
