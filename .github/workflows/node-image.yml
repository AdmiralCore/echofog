name: node-image

# Builds the Docker image of the headless node and publishes it to the GitHub Container Registry
# as ghcr.io/<owner>/echofog-node, for linux/amd64 and linux/arm64, so a VPS only pulls it instead
# of compiling (which needs a few GB of disk). Tags: latest on pushes to main (stable), dev on pushes
# to dev (what is being tested), sha-<commit> on both, 1.2.3 and 1.2 on version tags.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: node-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: echofog-node image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the Go build cross-compiles natively; QEMU only runs the small final stage for arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and version
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echofog-node" >> "$GITHUB_OUTPUT"
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=echofog-node
            org.opencontainers.image.description=Headless EchoFog node: DHT, relay, optional exit
      - uses: docker/build-push-action@v6
        with:
          context: ./echofog-core-oss
          file: ./echofog-core-oss/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.names.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
